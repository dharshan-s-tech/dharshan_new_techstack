<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" width="100%" height="100%">
  <g fill="none" stroke="#375595" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Globe Ellipse -->
    <ellipse cx="48" cy="32" rx="36" ry="26" />
    
    <!-- Equator & Latitudes -->
    <line x1="12" y1="32" x2="84" y2="32" />
    <path d="M 16,21 C 28,14 68,14 80,21" />
    <path d="M 16,43 C 28,50 68,50 80,43" />
    
    <!-- Meridians / Longitudes -->
    <line x1="48" y1="6" x2="48" y2="58" />
