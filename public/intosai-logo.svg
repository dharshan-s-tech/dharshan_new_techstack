  </g>
  
  <!-- Crisp INTOSAI Typography -->
  <text x="48" y="80" font-family="'Impact', 'Arial Black', 'Segoe UI Black', sans-serif" font-weight="900" font-size="16.5" fill="#375595" text-anchor="middle" letter-spacing="1.2">INTOSAI</text>
