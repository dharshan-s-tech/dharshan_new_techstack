<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2E7D32" />
      <stop offset="100%" stopColor="#1B5E20" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0288D1" />
      <stop offset="100%" stopColor="#01579B" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#D4AF37" />
      <stop offset="50%" stopColor="#FFDF73" />
      <stop offset="100%" stopColor="#AA7A1E" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#goldRing)" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="86" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>

  <!-- Globe Background Grid -->
  <circle cx="100" cy="100" r="62" fill="#E8F5E9" stroke="#81C784" stroke-width="1.2"/>
  <ellipse cx="100" cy="100" rx="62" ry="24" fill="none" stroke="#A5D6A7" stroke-width="1" stroke-dasharray="2,2"/>
  <ellipse cx="100" cy="100" rx="32" ry="62" fill="none" stroke="#A5D6A7" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="38" y1="100" x2="162" y2="100" stroke="#81C784" stroke-width="1.2"/>
  <line x1="100" y1="38" x2="100" y2="162" stroke="#81C784" stroke-width="1.2"/>

  <!-- Twin Eco Leaves in Center -->
  <path d="M 100,105 C 80,85 75,55 100,48 C 125,55 120,85 100,105 Z" fill="url(#leafGrad)" />
  <path d="M 100,52 L 100,102" stroke="#A5D6A7" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 100,68 C 92,64 86,66 84,68" stroke="#A5D6A7" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 100,78 C 90,75 84,79 82,82" stroke="#A5D6A7" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 100,68 C 108,64 114,66 116,68" stroke="#A5D6A7" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 100,78 C 110,75 116,79 118,82" stroke="#A5D6A7" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Water Ripple Arc -->
  <path d="M 72,122 C 86,116 114,116 128,122" fill="none" stroke="url(#blueGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 64,132 C 84,124 116,124 136,132" fill="none" stroke="url(#blueGrad)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Laurel Wreath Around Globe -->
  <g fill="#2E7D32">
    <!-- Left Wreath -->
    <path d="M 46,135 C 36,115 36,80 48,60 C 47,65 42,78 45,95 C 47,108 51,122 56,130 Z"/>
    <path d="M 40,75 C 33,70 30,62 34,56 C 40,58 43,65 40,75 Z"/>
    <path d="M 37,92 C 30,88 28,80 32,74 C 38,76 40,84 37,92 Z"/>
    <path d="M 37,110 C 30,108 28,100 32,94 C 38,96 40,104 37,110 Z"/>
    <path d="M 41,128 C 34,127 32,120 36,114 C 42,115 44,122 41,128 Z"/>
    <!-- Right Wreath -->
    <path d="M 154,135 C 164,115 164,80 152,60 C 153,65 158,78 155,95 C 153,108 149,122 144,130 Z"/>
    <path d="M 160,75 C 167,70 170,62 166,56 C 160,58 157,65 160,75 Z"/>
    <path d="M 163,92 C 170,88 172,80 168,74 C 162,76 160,84 163,92 Z"/>
    <path d="M 163,110 C 170,108 172,100 168,94 C 162,96 160,104 163,110 Z"/>
    <path d="M 159,128 C 166,127 168,120 164,114 C 158,115 156,122 159,128 Z"/>
  </g>

  <!-- Text Top & Bottom -->
  <path id="textArcTop" d="M 32,100 A 68,68 0 0,1 168,100" fill="none"/>
  <text font-family="'Noto Sans', sans-serif" font-size="10.5" font-weight="bold" fill="#751639" letter-spacing="1.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      iCED • CAG OF INDIA
    </textPath>
  </text>

  <!-- Bottom Badge: JAIPUR -->
  <rect x="68" y="152" width="64" height="18" rx="4" fill="#751639"/>
  <text x="100" y="165" font-family="'Noto Sans', sans-serif" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    JAIPUR
  </text>
</svg>
