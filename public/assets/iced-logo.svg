<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 60" width="160" height="60">
  <!-- iCED Text -->
  <text x="5" y="42" font-family="'Noto Sans', 'Arial', sans-serif" font-size="34" font-weight="900" fill="#006837" letter-spacing="-0.5">iCED</text>
  
  <!-- Leaf with Globe Grid -->
  <g transform="translate(92, 10)">
    <!-- Leaf Body -->
    <path d="M 0,25 C 10,5 35,-2 60,25 C 35,52 10,45 0,25 Z" fill="#2E7D32"/>
    
    <!-- Central Leaf Stem -->
    <line x1="0" y1="25" x2="60" y2="25" stroke="#E8F5E9" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Globe Latitude / Longitude lines inside Leaf -->
    <ellipse cx="30" cy="25" rx="18" ry="14" fill="none" stroke="#A5D6A7" stroke-width="1.2" opacity="0.9"/>
    <ellipse cx="30" cy="25" rx="8" ry="14" fill="none" stroke="#A5D6A7" stroke-width="1.1" opacity="0.8"/>
    
    <!-- Leaf Veins / Latitude Curves -->
    <path d="M 12,18 C 22,22 38,22 48,18" fill="none" stroke="#A5D6A7" stroke-width="1.1" opacity="0.85"/>
    <path d="M 12,32 C 22,28 38,28 48,32" fill="none" stroke="#A5D6A7" stroke-width="1.1" opacity="0.85"/>
  </g>
</svg>
